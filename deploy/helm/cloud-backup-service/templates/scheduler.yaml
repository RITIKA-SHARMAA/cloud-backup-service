apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cbs.name" . }}-scheduler
  labels: {{- include "cbs.labels" . | nindent 4 }}
    app.kubernetes.io/component: scheduler
spec:
  replicas: {{ .Values.scheduler.replicas }}
  selector:
    matchLabels: {{- include "cbs.labels" . | nindent 6 }}
      app.kubernetes.io/component: scheduler
  template:
    metadata:
      labels: {{- include "cbs.labels" . | nindent 8 }}
        app.kubernetes.io/component: scheduler
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/config.yaml") . | sha256sum }}
    spec:
      containers:
        - name: scheduler
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["scheduler"]
          {{- include "cbs.env" . | nindent 10 }}
          ports:
            - name: http
              containerPort: 8081
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources: {{- toYaml .Values.scheduler.resources | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
