apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cbs.name" . }}-worker
  labels: {{- include "cbs.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels: {{- include "cbs.labels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels: {{- include "cbs.labels" . | nindent 8 }}
        app.kubernetes.io/component: worker
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/config.yaml") . | sha256sum }}
        prometheus.io/scrape: "true"
        prometheus.io/port: "8082"
    spec:
      terminationGracePeriodSeconds: {{ .Values.worker.terminationGracePeriodSeconds }}
      containers:
        - name: worker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["worker"]
          {{- include "cbs.env" . | nindent 10 }}
          env:
            # Each pod's name becomes its worker ID, which shows up as lease_owner on jobs.
            - name: CBS_WORKER_ID
              valueFrom:
                fieldRef: { fieldPath: metadata.name }
          ports:
            - name: http
              containerPort: 8082
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources: {{- toYaml .Values.worker.resources | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
          volumeMounts:
            # Directory restores need somewhere writable; the root filesystem stays read-only.
            - name: restore
              mountPath: /restore
      volumes:
        - name: restore
          emptyDir: {}
